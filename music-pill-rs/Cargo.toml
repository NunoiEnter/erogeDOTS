[package]
name = "music-pill-rs"
version = "1.0.0"
edition = "2021"

[dependencies]
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
cosmic-text = "0.12"
ureq = { version = "2", default-features = false, features = ["tls"] }
serde_json = "1"
calloop = "0.13"
calloop-wayland-source = "0.3"

[profile.release]
opt-level = "z"
strip = true
