[package]
name = "theme-picker"
version = "0.2.0"
edition = "2021"

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
tempfile = "3"
fs2 = "0.4"

[[bin]]
name = "theme-picker"
path = "src/main.rs"

[[bin]]
name = "desktop-config"
path = "src/bin/desktop-config.rs"

[[bin]]
name = "title-terminal"
path = "src/bin/title-terminal.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
