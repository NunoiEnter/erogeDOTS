# Theme: Nanami
# Yellow and red — bold and energetic like summer fireworks

[colors]
# Primary palette
primary = "#e6c855"
primary_light = "#f0da7a"
primary_dark = "#c44b4b"
bg = "#1a1418"
bg_light = "#261e22"
bg_surface = "#332830"
fg = "#f0e6d8"
fg_dim = "#b8a898"

# Bar
bar_border = "#e6c855"
bar_workspace_active = "●"
bar_workspace_default = "○"
bar_clock_icon = "🌙"

# Niri
niri_focus_active = "#e6c855"
niri_focus_inactive = "#332830"
niri_shadow = "#0007"

# Terminal opacity (wired into ghostty/kitty/alacritty/foot templates)
ghostty_opacity = "0.8"

# Wallpaper
wallpaper = "~/erogeDOTS/wallpapers/nanami.jpg"

# Cava
cava_colors = "#e6c855:#c44b4b:#f0da7a"

# Cmatrix
cmatrix_color = "yellow"

# Fetch (named colors only: red green yellow blue magenta cyan white)
fetch_label = "yellow"
fetch_logo_outer = "yellow"
fetch_logo_inner = "white"

# Catnap (named colors only)
catnap_primary = "$yellow"
catnap_accent = "$red"

# Character
char_name = "在原七海"
char_full = "Arihara Nanami"
char_game = "Riddle Joker"
char_quote = "That's not true... All little sisters love their brother's dlck. Everyone knows this; it's common sense."
