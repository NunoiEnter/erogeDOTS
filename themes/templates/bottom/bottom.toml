# bottom config — generated by theme-switch
# Template: themes/templates/bottom/bottom.toml
# Transparent: no bg_colour set, wallpaper shows through terminal opacity.

[flags]
dot_marker = true
rate = 1000

[styles.tables]
headers = { colour = "{{BTM_HEADER}}", bold = true }

[styles.cpu]
avg_entry_colour = "{{PRIMARY}}"
cpu_core_colours = ["{{PRIMARY_LIGHT}}", "{{BTM_TEAL}}", "{{PRIMARY}}", "{{PRIMARY_DARK}}"]

[styles.memory]
ram_colour = "{{BTM_TEAL}}"

[styles.network]
rx_colour = "{{BTM_HEADER}}"
tx_colour = "{{PRIMARY}}"

[styles.widgets]
border_colour = "{{FG}}"
widget_title = { colour = "{{FG}}" }
text = { colour = "{{FG}}" }
selected_text = { colour = "white", bg_colour = "{{BTM_SEL_BG}}" }

[[row]]
  ratio = 30
  [[row.child]]
    type = "cpu"
[[row]]
  ratio = 40
  [[row.child]]
    ratio = 1
    type = "mem"
  [[row.child]]
    ratio = 1
    [[row.child.child]]
      type = "temp"
    [[row.child.child]]
      type = "disk"
[[row]]
  ratio = 30
  [[row.child]]
    type = "net"
  [[row.child]]
    type = "proc"
    default = true
