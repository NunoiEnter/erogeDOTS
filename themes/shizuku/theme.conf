# Theme: Shizuku
# Violet night and pale sakura — quiet, distant, and a little mischievous

[colors]
# Primary palette
primary = "#c3a6dd"
primary_light = "#f0d8e8"
primary_dark = "#856a9f"
bg = "#171322"
bg_light = "#211a2e"
bg_surface = "#2d243c"
fg = "#eee7f3"
fg_dim = "#b8aac6"

# Bar
bar_border = "#d0b6e4"
bar_workspace_active = "❀"
bar_workspace_default = "·"
bar_clock_icon = "🌙"

# Niri
niri_focus_active = "#c3a6dd"
niri_focus_inactive = "#2d243c"
niri_shadow = "#0007"

# Terminal opacity (Ghostty, Kitty and Alacritty)
ghostty_opacity = "0.70"

# Wallpaper
wallpaper = "wallpapers/shizuku.png"

# Cava
cava_colors = "#c3a6dd:#856a9f:#f0d8e8"

# Cmatrix
cmatrix_color = "magenta"

# Fetch (named colors only: red green yellow blue magenta cyan white)
fetch_label = "magenta"
fetch_logo_outer = "magenta"
fetch_logo_inner = "white"

# Bottom (system monitor)
btm_header = "#7aa2f7"
btm_sel_bg = "#34548a"
btm_teal = "#7dcfff"

# Character
char_name = "夏目雫"
char_full = "Natsume Shizuku"
char_game = "Sakura no Uta -Sakura no Mori no Ue o Mau-"
char_quote = "S&M means outdoor. Outdoor means exhibitionism. That's what Google-sensei told me."

# Early-2000s romance VN interface (terminals keep the dark palette).
vn_paper = "#fff9f0"
vn_ink = "#43394b"
vn_muted = "#776477"
vn_accent = "#7c6199"
vn_tint = "#ece3f4"
vn_line = "#c9bcd8"
