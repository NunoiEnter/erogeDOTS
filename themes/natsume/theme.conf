# Theme: Natsume
# Brown, light blue, yellow — warm and cozy like a café

[colors]
# Primary palette
primary = "#c4956a"
primary_light = "#7ec8e3"
primary_dark = "#8b6344"
bg = "#1c1712"
bg_light = "#2a2118"
bg_surface = "#352b20"
fg = "#e8dcc8"
fg_dim = "#b8a890"

# Bar
bar_border = "#c4956a"
bar_workspace_active = "■"
bar_workspace_default = "□"
bar_clock_icon = "🍡"

# Niri
niri_focus_active = "#c4956a"
niri_focus_inactive = "#352b20"
niri_shadow = "#0007"

# Terminal opacity (wired into ghostty/kitty/alacritty/foot templates)
ghostty_opacity = "0.8"

# Wallpaper
wallpaper = "~/erogeDOTS/wallpapers/natsume.jpg"

# Cava
cava_colors = "#c4956a:#8b6344:#7ec8e3"

# Cmatrix
cmatrix_color = "yellow"

# Fetch (named colors only: red green yellow blue magenta cyan white)
fetch_label = "yellow"
fetch_logo_outer = "yellow"
fetch_logo_inner = "white"

# Catnap (named colors only)
catnap_primary = "$yellow"
catnap_accent = "$cyan"

# Character
char_name = "四季ナツメ"
char_full = "Shiki Natsume"
char_game = "Cafe Stella to Shinigami no Chou"
char_quote = "Huh?"
