# Theme: Meguru
# Orange/yellow/pink on grey — Inaba Meguru, Sanoba Witch (Yuzusoft)

[colors]
# Primary palette — orange accent, pink light, grey base
primary = "#f09a4c"
primary_light = "#f5b8d0"
primary_dark = "#b86a2a"
bg = "#1d1c1e"
bg_light = "#2a292c"
bg_surface = "#3a383c"
fg = "#f2ece6"
fg_dim = "#b8b0a8"

# Waybar
waybar_bg_gradient = "linear-gradient(135deg, #2e2418 0%, #2a292c 50%, #38302a 100%)"
waybar_border = "#f09a4c"
waybar_shadow = "rgba(240, 154, 76, 0.25)"
waybar_text = "#f2ece6"
waybar_active_bg = "linear-gradient(135deg, #f09a4c, #f5b8d0)"

# Niri
niri_focus_active = "#f09a4c"
niri_focus_inactive = "#3a383c"
niri_shadow = "#0007"

# Fastfetch
ff_color = "yellow"

# Ghostty terminal
ghostty_bg = "#1d1c1e"
ghostty_fg = "#f2ece6"
ghostty_opacity = "0.8"

# Nvim
nvim_colorscheme = "catppuccin-mocha"

# Wallpaper
wallpaper = "~/erogeDOTS/wallpapers/meguru.jpg"

# Icons
waybar_workspace_active = "◆"
waybar_workspace_default = "◇"
waybar_clock_icon = "🌅"

# Cava
cava_colors = "#f09a4c:#e6c055:#f5b8d0"

# Cmatrix
cmatrix_color = "yellow"

# Catnap (named colors only)
catnap_primary = "$yellow"
catnap_accent = "$magenta"

# Character
char_name = "Inaba Meguru"
char_full = "Inaba Meguru"
char_game = "Sanoba Witch (Yuzusoft)"
char_quote = "The witch's Sabbath begins."
