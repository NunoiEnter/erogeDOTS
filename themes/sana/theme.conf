# Theme: Sana
# Red/white/blue — Mashiro-iro Symphony Sana Edition

[colors]
# Display name in picker / theme-switch
name = "Sana Inui"
# Primary palette — red accent
primary = "#e05050"
primary_light = "#f0a0a0"
primary_dark = "#b83030"
bg = "#1a1c24"
bg_light = "#242838"
bg_surface = "#2e3248"
fg = "#f0f0f4"
fg_dim = "#b0b4c0"

# Waybar
waybar_bg_gradient = "linear-gradient(135deg, #2a1820 0%, #1e2040 50%, #242838 100%)"
waybar_border = "#e05050"
waybar_shadow = "rgba(224, 80, 80, 0.25)"
waybar_text = "#f0f0f4"
waybar_active_bg = "linear-gradient(135deg, #e05050, #5070c0)"

# Niri
niri_focus_active = "#e05050"
niri_focus_inactive = "#2e3248"
niri_shadow = "#0007"

# Fastfetch
ff_color = "red"

# Ghostty terminal
ghostty_bg = "#1a1c24"
ghostty_fg = "#f0f0f4"
ghostty_opacity = "0.8"

# Nvim
nvim_colorscheme = "catppuccin-mocha"

# Wallpaper
wallpaper = "~/erogeDOTS/wallpapers/sana.jpg"

# Icons
waybar_workspace_active = "◆"
waybar_workspace_default = "◇"
waybar_clock_icon = "国旗"

# Cava
cava_colors = "#e05050:#5070c0:#f0f0f4"

# Cmatrix
cmatrix_color = "red"

# Catnap (named colors only)
catnap_primary = "$red"
catnap_accent = "$cyan"

# Character
char_name = "乾 紗凪"
char_full = "Sana Inui"
char_game = "Mashiro-iro Symphony: Sana Edition"
char_quote = "Hehehe... Being able to legally beat this slime... ah, the pure joy!"
