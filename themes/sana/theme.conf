# Wallpaper
wallpaper = "wallpapers/sana.jpg"

# Cava
cava_colors = "#e05050:#5070c0:#f0f0f4"

# Cmatrix
cmatrix_color = "red"

# Fetch (named colors only: red green yellow blue magenta cyan white)
