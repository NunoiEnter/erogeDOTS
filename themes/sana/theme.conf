# Theme: Sana
# Red/white/blue — Mashiro-iro Symphony Sana Edition

[colors]
# Primary palette — red accent
primary = "#e05050"
primary_light = "#f0a0a0"
primary_dark = "#b83030"
bg = "#1a1c24"
bg_light = "#242838"
bg_surface = "#2e3248"
fg = "#f0f0f4"
fg_dim = "#b0b4c0"

# Bar
bar_border = "#e05050"
bar_workspace_active = "◆"
bar_workspace_default = "◇"
bar_clock_icon = "🚩"

# Niri
niri_focus_active = "#e05050"
niri_focus_inactive = "#2e3248"
niri_shadow = "#0007"

# Terminal opacity (Ghostty, Kitty and Alacritty)
