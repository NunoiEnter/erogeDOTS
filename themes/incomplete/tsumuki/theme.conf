# Theme: Tsumuki
# Royal gold + midnight blue — Shiiba Tsumugi, Sanoba Witch (Yuzusoft)
# PARKED in themes/incomplete/: wallpaper wallpapers/tsumuki.jpg missing.

[colors]
# Primary palette — golden accent
primary = "#e6c055"
primary_light = "#f5e0a0"
primary_dark = "#a8802f"
bg = "#14161e"
bg_light = "#1e2230"
bg_surface = "#2a3048"
fg = "#f0e9d8"
fg_dim = "#b0a890"

# Bar
bar_border = "#e6c055"
bar_workspace_active = "●"
bar_workspace_default = "○"
bar_clock_icon = "👑"

# Niri
niri_focus_active = "#e6c055"
niri_focus_inactive = "#2a3048"
niri_shadow = "#0007"

# Terminal opacity (wired into ghostty/kitty/alacritty/foot templates)
ghostty_opacity = "0.8"

# Wallpaper (MISSING — add wallpapers/tsumuki.jpg then move back to themes/)
wallpaper = "~/erogeDOTS/wallpapers/tsumuki.jpg"

# Cava
cava_colors = "#e6c055:#5070c0:#f0e9d8"

# Cmatrix
cmatrix_color = "yellow"

# Fetch (named colors only: red green yellow blue magenta cyan white)
fetch_label = "yellow"
fetch_logo_outer = "yellow"
fetch_logo_inner = "white"

# Catnap (named colors only)
catnap_primary = "$yellow"
catnap_accent = "$cyan"

# Character
char_name = "Shiiba Tsumugi"
char_full = "Shiiba Tsumugi"
char_game = "Sanoba Witch (Yuzusoft)"
char_quote = "Elegance in every spell."
