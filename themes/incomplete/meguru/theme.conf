# Theme: Meguru
# Orange/yellow/pink on grey — Inaba Meguru, Sanoba Witch (Yuzusoft)
# PARKED in themes/incomplete/: wallpaper wallpapers/meguru.jpg missing.

[colors]
# Primary palette — orange accent, pink light, grey base
primary = "#f09a4c"
primary_light = "#f5b8d0"
primary_dark = "#b86a2a"
bg = "#1d1c1e"
bg_light = "#2a292c"
bg_surface = "#3a383c"
fg = "#f2ece6"
fg_dim = "#b8b0a8"

# Bar
bar_border = "#f09a4c"
bar_workspace_active = "◆"
bar_workspace_default = "◇"
bar_clock_icon = "🌅"

# Niri
niri_focus_active = "#f09a4c"
niri_focus_inactive = "#3a383c"
niri_shadow = "#0007"

# Terminal opacity (wired into ghostty/kitty/alacritty/foot templates)
ghostty_opacity = "0.8"

# Wallpaper (MISSING — add wallpapers/meguru.jpg then move back to themes/)
wallpaper = "wallpapers/meguru.jpg"

# Cava
cava_colors = "#f09a4c:#e6c055:#f5b8d0"

# Cmatrix
cmatrix_color = "yellow"

# Fetch (named colors only: red green yellow blue magenta cyan white)
fetch_label = "yellow"
fetch_logo_outer = "yellow"
fetch_logo_inner = "white"

# Character
char_name = "Inaba Meguru"
char_full = "Inaba Meguru"
char_game = "Sanoba Witch (Yuzusoft)"
char_quote = "The witch's Sabbath begins."
