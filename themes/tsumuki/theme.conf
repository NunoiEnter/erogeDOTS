# Theme: Tsumuki
# Royal gold + midnight blue — Shiiba Tsumugi, Sanoba Witch (Yuzusoft)

[colors]
# Primary palette — golden accent
primary = "#e6c055"
primary_light = "#f5e0a0"
primary_dark = "#a8802f"
bg = "#14161e"
bg_light = "#1e2230"
bg_surface = "#2a3048"
fg = "#f0e9d8"
fg_dim = "#b0a890"

# Waybar
waybar_bg_gradient = "linear-gradient(135deg, #262014 0%, #1e2230 50%, #2a3048 100%)"
waybar_border = "#e6c055"
waybar_shadow = "rgba(230, 192, 85, 0.25)"
waybar_text = "#f0e9d8"
waybar_active_bg = "linear-gradient(135deg, #e6c055, #5070c0)"

# Niri
niri_focus_active = "#e6c055"
niri_focus_inactive = "#2a3048"
niri_shadow = "#0007"

# Fastfetch
ff_color = "yellow"

# Ghostty terminal
ghostty_bg = "#14161e"
ghostty_fg = "#f0e9d8"
ghostty_opacity = "0.8"

# Nvim
nvim_colorscheme = "tokyonight"

# Wallpaper
wallpaper = "~/erogeDOTS/wallpapers/tsumuki.jpg"

# Icons
waybar_workspace_active = "●"
waybar_workspace_default = "○"
waybar_clock_icon = "👑"

# Cava
cava_colors = "#e6c055:#5070c0:#f0e9d8"

# Cmatrix
cmatrix_color = "yellow"

# Catnap (named colors only)
catnap_primary = "$yellow"
catnap_accent = "$cyan"

# Character
char_name = "Shiiba Tsumugi"
char_full = "Shiiba Tsumugi"
char_game = "Sanoba Witch (Yuzusoft)"
char_quote = "Elegance in every spell."
